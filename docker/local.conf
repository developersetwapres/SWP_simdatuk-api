server {
    listen 80;
    listen [::]:80;

    client_max_body_size 150M;
    
    index index.php;
    root /app/public;

    server_name _;

    server_names_hash_bucket_size 128; # this seems to be required for some vhosts
    client_max_body_size          300M;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Host $server_name;
    proxy_set_header   X-NginX-Proxy true;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect  off;

    # CORS policy on https://docs.nginx.com/nginx-management-suite/acm/how-to/policies/cors/
    add_header Access-Control-Allow-Credentials true;
    add_header Access-Control-Allow-Headers 'Authorization, Origin, Content-Type, Accept, X-Cache-Status';
    add_header Access-Control-Allow-Methods *;
    add_header Access-Control-Allow-Origins *;
    add_header Access-Control-Expose-Headers *;
    add_header Access-Control-Max-Age 3600;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}