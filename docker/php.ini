; SIMDATUK PHP Configuration for Production Security
; This file overrides default PHP settings for security hardening

; ===============================
; SECURITY SETTINGS
; ===============================

; Hide PHP version from HTTP headers
expose_php = Off

; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Hide errors in production
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log

; Security Headers
; Note: Additional headers will be set via middleware
; Disable X-Powered-By header
expose_php = Off

; ===============================
; SESSION SECURITY
; ===============================

; Secure session configuration
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
session.cookie_lifetime = 7200

; ===============================
; FILE UPLOAD SECURITY
; ===============================

; File upload restrictions
file_uploads = On
upload_max_filesize = 10M
post_max_size = 10M
max_file_uploads = 5

; ===============================
; RESOURCE LIMITS
; ===============================

; Memory and execution limits
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; ===============================
; PERFORMANCE SETTINGS
; ===============================

; OPcache settings for production
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 7000
opcache.revalidate_freq = 300
opcache.fast_shutdown = 1

; ===============================
; LOGGING
; ===============================

; Log errors but don't display
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /var/log/php_errors.log