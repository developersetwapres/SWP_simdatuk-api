user www-data;

worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on; # set off in development mode
    tcp_nopush on;
	types_hash_max_size 2048;
	
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;
	
	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;
	
	gzip on;
	
	server_names_hash_bucket_size 128;
	client_max_body_size          300M;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Host $server_name;
    proxy_set_header   X-NginX-Proxy true;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect  off;
	
	# Security Headers
	add_header X-Content-Type-Options nosniff;
	add_header X-Frame-Options DENY;
	add_header X-XSS-Protection "1; mode=block";
	add_header Referrer-Policy "strict-origin-when-cross-origin";
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';";
	
	# CORS Headers
	add_header Access-Control-Allow-Credentials true;
    add_header Access-Control-Allow-Headers 'Authorization, Origin, Content-Type, Accept, X-Cache-Status';
    add_header Access-Control-Allow-Methods *;
    add_header Access-Control-Allow-Origins *;
    add_header Access-Control-Expose-Headers *;
    add_header Access-Control-Max-Age 3600;
	
	# Hide server information
	server_tokens off;
	
	include /etc/nginx/conf.d/*.conf;
}